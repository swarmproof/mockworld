[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name: the plain `mockworld` name is reserved by another project on
# PyPI, so we ship as `mockworld-mcp`. The import package and CLI stay `mockworld`.
name = "mockworld-mcp"
version = "0.3.1"
description = "A synthetic internet for agents — deterministic, LLM-free fake services (Stripe, Gmail, exchange, CRM, S3) as MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Swarm Proof" }]
keywords = ["mcp", "agents", "testing", "mock", "deterministic", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]

# Core deps kept lean per NFR-DEP-1. `mcp` provides stdio + Streamable HTTP transport
# and, transitively, the ASGI/uvicorn machinery the HTTP transport and control plane use.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mockworld = "mockworld.cli:main"

# Ship the `mockworld` pytest fixture to any installed test suite.
[project.entry-points.pytest11]
mockworld = "mockworld.pytest_plugin"

[project.urls]
Homepage = "https://github.com/swarmproof/mockworld"
Repository = "https://github.com/swarmproof/mockworld"

[tool.hatch.build.targets.wheel]
# `packages` bundles the whole tree under src/mockworld — including the built-in
# mock definitions' YAML/markdown data — so no force-include is needed (adding one
# double-adds those files and breaks the wheel build).
packages = ["src/mockworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
